# Quando o painel (/admin) publica uma alteração, aplica o conteúdo no site:
# textos, vitrine, faixa de evento, horário, depoimentos, Google Analytics e
# Search Console. Também reduz as fotos enviadas pelo painel.
name: Publicar conteúdo do painel

on:
  push:
    branches: [main]
    paths:
      - "conteudo/**"
      - "assets/img/uploads/**"
      - "scripts/conteudo.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: publicar-conteudo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow (redução de fotos)
        run: pip install --quiet Pillow

      - name: Aplicar conteúdo no site
        run: python3 scripts/conteudo.py

      - name: Publicar, se algo mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nada a publicar."
            exit 0
          fi
          git config user.name "Publicação do painel"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aplica conteúdo do painel no site"
          git push
          # Commits do GITHUB_TOKEN podem não disparar o build do GitHub Pages
          # sozinhos: pede o build explicitamente.
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" \
            || echo "::warning::Não consegui pedir o build do Pages; ele deve rodar com o push."
