<!doctype html>
<!--
  Página de links da bio do Instagram — oticanoblesse.com.br/links

  Página independente: o estilo é embutido e não usa o styles.css nem o
  main.js do site, então mexer aqui não afeta o site (e vice-versa). Só
  reaproveita as fontes e o logo de /assets.

  Para trocar um link, edite o href do botão correspondente. O número do
  WhatsApp é o mesmo do site (CONFIG.whatsapp em assets/js/main.js), mas
  aqui está escrito à mão: se o número mudar, troque nos dois lugares.

  noindex: a página não aparece na busca do Google (o lugar dela é a bio).
-->

<style>
  @font-face{font-family:"Montserrat";src:url("/assets/fonts/montserrat-var-400-700.woff2") format("woff2");font-weight:400 700;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("/assets/fonts/cormorant-600.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Cormorant Garamond";src:url("/assets/fonts/cormorant-600-italic.woff2") format("woff2");font-weight:600;font-style:italic;font-display:swap}

  /* Lilás do logo (o mesmo das áreas de destaque do site), com o texto em
     ameixa e os detalhes no dourado do logo. */
  :root{
    --lilac-logo:#BEA5CE;--lilac-logo-deep:#B196C3;--lilac-100:#EDE0F4;
    --plum-900:#2B1236;--plum-800:#3C1D49;--plum-700:#4E2860;
    --gold-700:#8A6829;--gold-logo:#B98A3C;--gold-500:#C9A55C;
    --whats:#1FA855;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100svh;color:var(--plum-800);
    font:400 16px/1.6 "Montserrat","Segoe UI",Arial,sans-serif;
    background:
      radial-gradient(120% 55% at 50% 0%, rgba(255,255,255,.34), rgba(255,255,255,0) 70%),
      linear-gradient(180deg,var(--lilac-logo),var(--lilac-logo-deep));
    background-attachment:fixed;
  }
  main{
    max-width:440px;margin:0 auto;
    padding:max(40px,env(safe-area-inset-top)) 20px max(36px,env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;text-align:center;
  }

  /* o logo é dourado com fundo transparente: feito para ficar sobre o lilás */
  .marca img{display:block;width:170px;height:auto}

  h1{
    margin:14px 0 4px;
    font:600 2.1rem/1.1 "Cormorant Garamond",Georgia,serif;letter-spacing:.01em;color:var(--plum-900);
  }
  .frase{
    margin:0;font:600 italic 1.22rem/1.3 "Cormorant Garamond",Georgia,serif;color:var(--plum-700);
  }
  .local{
    margin:12px 0 0;font-size:.68rem;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
    color:rgba(60,29,73,.7);
  }
  .filete{width:44px;height:1px;margin:24px 0 26px;background:var(--gold-logo)}

  ul{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:14px}
  .link{
    display:flex;align-items:center;gap:14px;width:100%;
    padding:15px 18px;border-radius:14px;text-decoration:none;text-align:left;
    color:var(--plum-800);background:rgba(255,255,255,.42);
    border:1px solid rgba(255,255,255,.7);
    box-shadow:0 6px 18px rgba(60,29,73,.08);
    transition:transform .2s ease,background .2s ease,border-color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .link:hover,.link:focus-visible{background:rgba(255,255,255,.62);border-color:var(--gold-500);transform:translateY(-2px)}
  .link:active{transform:scale(.985)}
  .link:focus-visible{outline:2px solid var(--plum-700);outline-offset:3px}
  .icone{
    flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
    background:var(--lilac-100);color:var(--gold-700);
  }
  .icone svg{width:22px;height:22px}
  .texto{flex:1;min-width:0}
  .texto strong{display:block;font-size:.95rem;font-weight:600;letter-spacing:.01em}
  .texto span{display:block;font-size:.78rem;color:rgba(60,29,73,.72)}
  .seta{flex:none;width:18px;height:18px;color:var(--gold-700)}

  /* destaque: o WhatsApp é a ação principal */
  .link-whats{background:#fff;border-color:var(--gold-500);box-shadow:0 10px 26px rgba(60,29,73,.14)}
  .link-whats:hover,.link-whats:focus-visible{background:#fff;border-color:var(--gold-logo)}
  .link-whats .icone{background:#E7F7EE;color:var(--whats)}

  address{
    margin:34px 0 0;font-style:normal;font-size:.8rem;line-height:1.7;color:rgba(60,29,73,.78);
  }
  footer{margin-top:22px;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(60,29,73,.5)}

  @media (prefers-reduced-motion:reduce){ .link{transition:none} .link:hover,.link:focus-visible{transform:none} }
</style>
</head>
